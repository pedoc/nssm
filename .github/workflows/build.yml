name: Build NSSM

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Validate release contracts
        run: |
          python -m black --check tests
          python -m ruff check tests
          python -IB -m pytest -q -p no:cacheprovider tests

  build:
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [win32, win64]
        configuration: [Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Locate Visual Studio (devenv)
        id: vs
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (-not $vsPath) { throw "Visual Studio not found" }
          $devenv = Join-Path $vsPath "Common7\IDE\devenv.com"
          if (-not (Test-Path $devenv)) { throw "devenv not found at $devenv" }
          "devenv=$devenv" >> $env:GITHUB_OUTPUT

      - name: Upgrade solution to current toolset
        shell: cmd
        run: "\"${{ steps.vs.outputs.devenv }}\" nssm.sln /Upgrade"

      - name: Build solution (MSBuild)
        shell: cmd
        run: msbuild.exe nssm.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /m

      - name: Package verified executable
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD "out\Release\$env:PLATFORM\nssm.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Build output missing: $exe"
          }
          $header = Get-Content -LiteralPath version.h -Raw
          $match = [regex]::Match($header, 'NSSM_VERSION _T\("([\d.]+)"\)')
          if (-not $match.Success) { throw 'Cannot read version.h' }
          $expectedVersion = $match.Groups[1].Value
          $actualVersion = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
          if ($actualVersion -ne $expectedVersion) {
            throw "EXE version $actualVersion does not match $expectedVersion"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = Join-Path $PWD "dist/nssm-$($env:PLATFORM).zip"
          Compress-Archive -LiteralPath $exe -DestinationPath $archive

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nssm-${{ matrix.platform }}-${{ matrix.configuration }}
          path: dist/nssm-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download both build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nssm-*-Release
          merge-multiple: true
          path: dist

      - name: Verify ZIP layout and generate checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for archive in nssm-win32.zip nssm-win64.zip; do
            test "$(unzip -Z1 "$archive")" = nssm.exe
            unzip -t "$archive"
          done
          sha256sum nssm-win32.zip nssm-win64.zip > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create draft, verify uploaded assets, and publish
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" nssm-win32.zip nssm-win64.zip SHA256SUMS.txt \
            --draft --verify-tag --generate-notes --title "NSSM $RELEASE_TAG"
          verify_dir=$(mktemp -d)
          gh release download "$RELEASE_TAG" --dir "$verify_dir" \
            --pattern 'nssm-win*.zip' --pattern SHA256SUMS.txt
          (cd "$verify_dir" && sha256sum --check SHA256SUMS.txt)
          gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Verify public release downloads
        shell: bash
        run: |
          set -euo pipefail
          verify_dir=$(mktemp -d)
          for asset in nssm-win32.zip nssm-win64.zip SHA256SUMS.txt; do
            curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
              --output "$verify_dir/$asset" \
              "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$asset"
          done
          (cd "$verify_dir" && sha256sum --check SHA256SUMS.txt)
          printf 'Release verified: https://github.com/%s/releases/tag/%s\n' \
            "$GH_REPO" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
