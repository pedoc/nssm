name: NSSM Next GUI prototype checks

on:
  push:
    branches: [feat/winui3-unified-prototype]
    paths:
      - 'next/**'
      - '.github/workflows/next-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-prototype-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: GUI prototype build and tests
    if: github.repository == 'pedoc/nssm' && github.ref == 'refs/heads/feat/winui3-unified-prototype'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Preserve production-file bytes during checkout
        run: git config --global core.autocrlf false
      - name: Check out experimental branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validation tools
        run: python -m pip install --disable-pip-version-check -r next/tests/requirements.txt
      - name: Validate source and CI safety contracts
        run: |
          python -m black --check next/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check --no-cache next/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -IB -m pytest -q -p no:cacheprovider next/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File next/build/check-syntax.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build GUI prototype
        run: pwsh -NoProfile -File next/build/build.ps1 -Project App
      - name: Build and test GUI routing
        run: |
          pwsh -NoProfile -File next/build/build.ps1 -Project Router
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./next/out/Tests/RouterTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
